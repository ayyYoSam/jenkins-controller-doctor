# Jenkins Controller Doctor
# Application metadata

application.name=Jenkins Controller Doctor
application.version=0.1.0
application.description=Command-line diagnostic tool for Jenkins controllers

# HTTP defaults
http.connect-timeout-seconds=10
http.request-timeout-seconds=30
http.max-response-size-bytes=10485760

# Health check thresholds
checks.queue.warning-size=10
checks.queue.critical-size=50
checks.queue.warning-wait-minutes=10
checks.queue.critical-wait-minutes=30

checks.executor.warning-utilization-percent=80
checks.executor.critical-utilization-percent=95

checks.disk.warning-free-percent=20
checks.disk.critical-free-percent=10

# Jenkins compatibility
checks.jenkins.minimum-major=2
checks.jenkins.minimum-version=2.400